<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>لعبة دمج القطط</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
        }
        .header {
            width: 100%;
            max-width: 360px;
        }
        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            font-size: 15px;
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 8px;
        }
        .stats-item span {
            color: #ffd700;
        }
        .title-box h3 {
            margin: 5px 0;
            font-size: 15px;
            color: #00ff88;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 340px;
            margin: 10px 0;
        }
        .slot {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            cursor: pointer;
            position: relative;
            transition: transform 0.1s, border-color 0.2s, background 0.2s;
        }
        .slot:active {
            transform: scale(0.95);
        }
        .slot.selected {
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.25);
            box-shadow: 0 0 15px rgba(0,255,136,0.5);
        }
        .slot-lvl {
            position: absolute;
            bottom: 4px;
            font-size: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 2px 5px;
            border-radius: 8px;
            color: #fff;
        }
        .panel {
            width: 100%;
            max-width: 340px;
            background: rgba(0,0,0,0.35);
            padding: 10px;
            border-radius: 15px;
            margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-action {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 75, 43, 0.4);
            margin-bottom: 6px;
        }
        .shop-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 6px;
        }
        .shop-item-btn {
            background: linear-gradient(45deg, #11998e, #38ef7d);
            color: white;
            border: none;
            padding: 8px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
        }
        .btn-gift {
            background: linear-gradient(45deg, #f7b733, #fc4a1a);
            color: white;
            border: none;
            width: 100%;
            padding: 9px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
        }
        .btn-action:active, .shop-item-btn:active, .btn-gift:active {
            transform: scale(0.98);
        }
        .leaderboard {
            font-size: 12px;
            color: #b8b8b8;
            margin-top: 5px;
        }
        .leaderboard span {
            color: #ffcc00;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="stats-bar">
            <div class="stats-item">🪙 النقود: <span id="coinCount">120</span></div>
            <div class="stats-item">🏆 أعلى مستوى: <span id="maxLevelAchieved">1</span></div>
        </div>
        <div class="title-box">
            <h3 id="gameStatus">ادمج القطط للوصول إلى اللقب الملكي!</h3>
        </div>
    </div>

    <div class="grid-container" id="grid"></div>

    <div class="panel">
        <button class="btn-action" onclick="spawnCat()">إنتاج قطة أساسية 🐱 (تكلفة: <span id="spawnCost">10</span> 🪙)</button>
        
        <div class="shop-grid">
            <button class="shop-item-btn" onclick="buyCatLevel(1)">شراء 🐱 (Lv.1) - 30🪙</button>
            <button class="shop-item-btn" onclick="buyCatLevel(2)">شراء 😺 (Lv.2) - 70🪙</button>
        </div>
        
        <button class="btn-gift" onclick="getFreeCoins()">🎁 هدية مجانية (+70 نقود)</button>
        <div class="leaderboard">
            👑 الترتيب التنافسي: المركز <span id="userRank">1</span> بين اللاعبين
        </div>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        const CAT_EVOLUTIONS = [
            { level: 1, icon: "🐱", name: "قطة صغيرة" },
            { level: 2, icon: "😺", name: "قطة مرحة" },
            { level: 3, icon: "😸", name: "قطة مبتسمة" },
            { level: 4, icon: "😻", name: "قطة قلوب" },
            { level: 5, icon: "😽", name: "قطة لطيفة" },
            { level: 6, icon: "🐈‍⬛", name: "قطة نادرة" },
            { level: 7, icon: "🦁", name: "ملك القطط" },
            { level: 8, icon: "👑", name: "القط الأسطوري النهائي" }
        ];

        let board = Array(9).fill(null);
        let coins = 120;
        let spawnCost = 10;
        let selectedIndex = null;
        let maxLevel = 1;
        let score = 0;

        function createGrid() {
            const gridEl = document.getElementById("grid");
            gridEl.innerHTML = "";
            for (let i = 0; i < 9; i++) {
                const slot = document.createElement("div");
                slot.className = "slot";
                slot.id = "slot-" + i;
                slot.onclick = () => handleSlotClick(i);
                gridEl.appendChild(slot);
            }
            updateUI();
        }

        function updateUI() {
            let highestCurrent = 1;
            for (let i = 0; i < 9; i++) {
                const slot = document.getElementById("slot-" + i);
                slot.className = "slot" + (selectedIndex === i ? " selected" : "");
                
                if (board[i] !== null) {
                    const lvl = board[i];
                    if (lvl > highestCurrent) highestCurrent = lvl;
                    const catData = CAT_EVOLUTIONS[lvl - 1];
                    slot.innerHTML = `
                        <div>${catData.icon}</div>
                        <div class="slot-lvl">Lv.${catData.level}</div>
                    `;
                } else {
                    slot.innerHTML = "";
                }
            }

            if (highestCurrent > maxLevel) {
                maxLevel = highestCurrent;
            }

            document.getElementById("coinCount").innerText = coins;
            document.getElementById("maxLevelAchieved").innerText = maxLevel;
            document.getElementById("spawnCost").innerText = spawnCost;

            if (maxLevel >= CAT_EVOLUTIONS.length) {
                document.getElementById("gameStatusinnerHTML") = "🎉 مبروك! فزت بالقط الأسطوري!";
            }
        }

        function spawnCat() {
            if (coins < spawnCost) {
                alert("❌ نفذت نقودك! اضغط على هدية مجانية 🎁.");
                return;
            }

            const emptySlots = [];
            board.forEach((val, idx) => {
                if (val === null) emptySlots.push(idx);
            });

            if (emptySlots.length === 0) {
                alert("⚠️ المساحة ممتلئة! ادمج القطط لتفريغ المكان.");
                return;
            }

            coins -= spawnCost;
            spawnCost = Math.min(spawnCost + 2, 35);

            const randomSlot = emptySlots[Math.floor(Math.random() * emptySlots.length)];
            board[randomSlot] = 1;
            updateUI();
        }

        function buyCatLevel(targetLevel) {
            let cost = targetLevel === 1 ? 30 : 70;
            if (coins < cost) {
                alert(`❌ تحتاج إلى ${cost} 🪙.`);
                return;
            }

            const emptySlots = [];
            board.forEach((val, idx) => {
                if (val === null) emptySlots.push(idx);
            });

            if (emptySlots.length === 0) {
                alert("⚠️ المساحة ممتلئة!");
                return;
            }

            coins -= cost;
            const randomSlot = emptySlots[Math.floor(Math.random() * emptySlots.length)];
            board[randomSlot] = targetLevel;
            updateUI();
        }

        function getFreeCoins() {
            coins += 70;
            alert("🎁 حصلت على 70 نقود هدية!");
            updateUI();
        }

        function handleSlotClick(index) {
            if (selectedIndex === null) {
                if (board[index] !== null) {
                    selectedIndex = index;
                }
            } else {
                if (selectedIndex === index) {
                    selectedIndex = null;
                } else if (board[index] === null) {
                    board[index] = board[selectedIndex];
                    board[selectedIndex] = null;
                    selectedIndex = null;
                } else if (board[index] === board[selectedIndex]) {
                    const currentLevel = board[index];
                    if (currentLevel < CAT_EVOLUTIONS.length) {
                        board[index] = currentLevel + 1;
                        board[selectedIndex] = null;
                        
                        coins += currentLevel * 50;
                        score += currentLevel * 50;
                        
                        let rank = Math.max(1, 100 - Math.floor(score / 200));
                        document.getElementById("userRank").innerText = rank;
                    }
                    selectedIndex = null;
                } else {
                    const temp = board[index];
                    board[index] = board[selectedIndex];
                    board[selectedIndex] = temp;
                    selectedIndex = null;
                }
            }
            updateUI();
        }

        createGrid();
    </script>
</body>
</html>
