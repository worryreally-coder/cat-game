<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>لعبة دمج القطط - مع المتجر المتكامل</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
        }
        .header {
            width: 100%;
            max-width: 360px;
        }
        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            font-size: 14px;
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 6px;
        }
        .stats-item span {
            color: #ffd700;
        }
        .title-box h3 {
            margin: 4px 0;
            font-size: 14px;
            color: #00ff88;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 100%;
            max-width: 320px;
            margin: 6px 0;
        }
        .slot {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
            position: relative;
            transition: transform 0.1s, border-color 0.2s, background 0.2s;
        }
        .slot:active {
            transform: scale(0.95);
        }
        .slot.selected {
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.25);
            box-shadow: 0 0 12px rgba(0,255,136,0.5);
        }
        .slot-lvl {
            position: absolute;
            bottom: 3px;
            font-size: 9px;
            background: rgba(0, 0, 0, 0.7);
            padding: 1px 4px;
            border-radius: 6px;
            color: #fff;
        }
        .panel {
            width: 100%;
            max-width: 340px;
            background: rgba(0,0,0,0.35);
            padding: 8px;
            border-radius: 15px;
            margin-bottom: 5px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .shop-title {
            font-size: 13px;
            color: #ffcc00;
            margin: 0 0 6px 0;
            font-weight: bold;
        }
        .btn-action {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            width: 100%;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 75, 43, 0.4);
            margin-bottom: 5px;
        }
        .shop-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .shop-item-btn {
            background: linear-gradient(45deg, #11998e, #38ef7d);
            color: white;
            border: none;
            padding: 8px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
        }
        .btn-gift {
            background: linear-gradient(45deg, #f7b733, #fc4a1a);
            color: white;
            border: none;
            width: 100%;
            padding: 8px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 5px;
        }
        .btn-action:active, .shop-item-btn:active, .btn-gift:active {
            transform: scale(0.98);
        }
        .leaderboard {
            font-size: 11px;
            color: #b8b8b8;
            margin-top: 3px;
        }
        .leaderboard span {
            color: #ffcc00;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="stats-bar">
            <div class="stats-item">🪙 النقود: <span id="coinCount">120</span></div>
            <div class="stats-item">🏆 أعلى مستوى: <span id="maxLevelAchieved">1</span></div>
        </div>
        <div class="title-box">
            <h3 id="gameStatus">تسوق وادمج القطط للوصول للقب الملكي!</h3>
        </div>
    </div>

    <div class="grid-container" id="grid"></div>

    <div class="panel">
        <button class="btn-action" onclick="spawnCat()">إنتاج قطة أساسية 🐱 (تكلفة: <span id="spawnCost">10</span> 🪙)</button>
        
        <div class="shop-title">🛒 متجر القطط والترقيات:</div>
        <div class="shop-grid">
            <button class="shop-item-btn" onclick="buyCatLevel(1)">شراء 🐱 (Lv.1)<br>بـ 30 🪙</button>
            <button class="shop-item-btn" onclick="buyCatLevel(2)">شراء 😺 (Lv.2)<br>بـ 70 🪙</button>
            <button class="shop-item-btn" onclick="buyCatLevel(3)">شراء 😸 (Lv.3)<br>بـ 150 🪙</button>
            <button class="shop-item-btn" onclick="buyCatLevel(4)">شراء 😻 (Lv.4)<br>بـ 300 🪙</button>
        </div>
        
        <button class="btn-gift" onclick="getFreeCoins()">🎁 صندوق الهدية اليومية (+70 نقود)</button>
        <div class="leaderboard">
            👑 الترتيب التنافسي: المركز <span id="userRank">1</span> بين اللاعبين
        </div>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            
            if (type === 'merge') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            } else if (type === 'buy') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            } else if (type === 'win') {
                let notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, index) => {
                    let o = audioCtx.createOscillator();
                    let g = audioCtx.createGain();
                    o.type = 'triangle';
                    o.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.15);
                    g.gain.setValueAtTime(0.4, audioCtx.currentTime + index * 0.15);
                    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + index * 0.15 + 0.3);
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.start(audioCtx.currentTime + index * 0.15);
                    o.stop(audioCtx.currentTime + index * 0.15 + 0.3);
                });
                return;
            }
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        const CAT_EVOLUTIONS = [
            { level: 1, icon: "🐱", name: "قطة صغيرة" },
            { level: 2, icon: "😺", name: "قطة مرحة" },
            { level: 3, icon: "😸", name: "قطة مبتسمة" },
            { level: 4, icon: "😻", name: "قطة قلوب" },
            { level: 5, icon: "😽", name: "قطة لطيفة" },
            { level: 6, icon: "🐈‍⬛", name: "قطة نادرة" },
            { level: 7, icon: "🦁", name: "ملك القطط" },
            { level: 8, icon: "👑", name: "القط الأسطوري النهائي" }
        ];

        let board = Array(9).fill(null);
        let coins = 120;
        let spawnCost = 10;
        let selectedIndex = null;
        let maxLevel = 1;
        let score = 0;
        let hasWon = false;

        function createGrid() {
            const gridEl = document.getElementById("grid");
            gridEl.innerHTML = "";
            for (let i = 0; i < 9; i++) {
                const slot = document.createElement("div");
                slot.className = "slot";
                slot.id = "slot-" + i;
                slot.onclick = () => handleSlotClick(i);
                gridEl.appendChild(slot);
            }
            updateUI();
        }

        function updateUI() {
            let highestCurrent = 1;
            for (let i = 0; i < 9; i++) {
                const slot = document.getElementById("slot-" + i);
                slot.className = "slot" + (selectedIndex === i ? " selected" : "");
                
                if (board[i] !== null) {
                    const lvl = board[i];
                    if (lvl > highestCurrent) highestCurrent = lvl;
                    const catData = CAT_EVOLUTIONS[lvl - 1];
                    slot.innerHTML = `
                        <div>${catData.icon}</div>
                        <div class="slot-lvl">Lv.${catData.level}</div>
                    `;
                } else {
                    slot.innerHTML = "";
                }
            }

            if (highestCurrent > maxLevel) {
                maxLevel = highestCurrent;
            }

            document.getElementById("coinCount").innerText = coins;
            document.getElementById("maxLevelAchieved").innerText = maxLevel;
            document.getElementById("spawnCost").innerText = spawnCost;

            if (maxLevel >= CAT_EVOLUTIONS.length) {
                document.getElementById("gameStatus").innerHTML = "🎉 مبروك! لقد فزت وأنهيت اللعبة بالقط الأسطوري!";
                if (!hasWon) {
                    hasWon = true;
                    playSound('win');
                }
            }
        }

        function spawnCat() {
            if (coins < spawnCost) {
                alert
